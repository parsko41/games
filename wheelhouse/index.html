<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheelhouse</title>
<style>
  :root{
    --bg:#10162b; --panel:#1a2342; --panel2:#222d55; --ink:#eef1ff; --dim:#9aa4c9;
    --gold:#ffcf4a; --green:#1f8a5b; --green2:#16704a; --tile:#f7f7f2; --blue:#3d7bff;
    --red:#e5484d; --ok:#35c46a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--panel2);cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:var(--gold);color:#1b1400;font-weight:700}
  button.go{background:var(--ok);color:#04210f;font-weight:700}
  input,select{font:inherit;color:var(--ink);background:#0c1124;border:1px solid #34407a;border-radius:10px;padding:11px 12px;width:100%}
  #app{max-width:560px;margin:0 auto;padding:6px 10px calc(env(safe-area-inset-bottom) + 28px)}
  header{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:34px}
  header h1{font-size:19px;margin:0;letter-spacing:.3px;color:var(--gold);white-space:nowrap}
  header h1 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:3px}
  header #menuBtn{padding:4px 8px;font-size:20px;background:transparent;margin-left:auto}

  /* board */
  #board{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;padding:8px;background:#0b3d28;border-radius:12px;border:3px solid #2a5;box-shadow:0 0 0 3px #0b3d28 inset}
  .c{aspect-ratio:5/6;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:min(5vw,26px);color:#111}
  .c.x{visibility:hidden}
  .c.g{background:var(--green)}
  .c.t{background:var(--tile)}
  .c.new{background:#6ea0ff;animation:pop .6s}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  #catRow{text-align:center;margin:5px 0 0;font-size:17px;line-height:1.3}
  #cat{font-weight:700;letter-spacing:1px;text-transform:uppercase}
  #sub{color:var(--dim);font-size:14px;margin-left:8px}
  #hint{text-align:center;color:var(--dim);font-size:28px}

  /* players */
  #players{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px;margin:6px 0}
  .p{background:var(--panel);border-radius:10px;padding:4px 8px;border:2px solid transparent;min-width:0;line-height:1.25}
  .p.on{border-color:var(--gold);background:#2a2a46}
  .p .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p .bk{font-size:21px;font-weight:800;color:var(--gold)}
  .p .hd{display:flex;align-items:baseline;gap:4px}
  .p .hd .nm{flex:1;min-width:0}
  .p .tt{font-size:13px;color:var(--dim);white-space:nowrap}
  .p .nm{font-size:17px}
  .p.me .nm::after{content:" (you)";color:var(--dim);font-weight:400;font-size:13px}

  #msg{background:var(--panel);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:16px;line-height:1.3}
  #msg .old{display:none}
  #msg .old{color:var(--dim);font-size:14px}

  /* tabs */
  #tabs{display:flex;gap:5px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{flex:0 0 auto;padding:5px 10px;border-radius:999px;font-size:15px;background:var(--panel);color:var(--dim);position:relative;white-space:nowrap}
  #tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
  #tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:1px}
  #tabs button.add{font-weight:800;color:var(--gold)}

  /* the wheel, laid out as a horizontal strip of value bars */
  #stripWrap{position:relative;height:var(--sh,66px);overflow:hidden;border-radius:12px;background:#0b1020;border:2px solid #2a3566;margin:0 0 6px}
  #strip{position:absolute;left:0;top:0;height:100%;display:flex;will-change:transform;transition:transform 4.2s cubic-bezier(.12,.67,.18,1)}
  .bar{flex:0 0 var(--bw,46px);height:100%;display:flex;align-items:center;justify-content:center;border-right:2px solid #0b1020;writing-mode:vertical-rl;text-orientation:upright;font:800 17px/1 Arial,sans-serif;letter-spacing:-3px;color:#111}
  .bar.word{font-size:9.5px;letter-spacing:-1.5px;line-height:1.2;writing-mode:vertical-lr}
  .bar.bk{background:#111;color:#fff}
  .bar.lt{background:#f4f4f4}
  .bar.top{background:linear-gradient(#f3d36b,#c9a227)}
  #frame{position:absolute;top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);background:var(--gold);box-shadow:0 0 0 1.5px #000c,0 0 8px #000;pointer-events:none;z-index:2;filter:drop-shadow(0 0 1.5px #000)}
  #frame::before,#frame::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border-left:11px solid transparent;border-right:11px solid transparent}
  #frame::before{top:0;border-top:15px solid var(--gold)}
  #frame::after{bottom:0;border-bottom:15px solid var(--gold)}
  #stripWrap::before,#stripWrap::after{content:"";position:absolute;top:0;bottom:0;width:18%;z-index:1;pointer-events:none}
  #stripWrap::before{left:0;background:linear-gradient(90deg,#0b1020,#0b102000)}
  #stripWrap::after{right:0;background:linear-gradient(-90deg,#0b1020,#0b102000)}

  #actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
  #actions button{flex:1 1 30%;min-width:90px;padding:12px 12px;font-size:19px}
  #actions .note{width:100%;text-align:center;color:var(--dim);font-size:16px}

  #keys{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  #keys button{padding:11px 0;font-weight:800;font-size:26px;line-height:1.2;border-radius:8px}
  #keys button.v{background:#3b2f6b}
  #keys button.sel{background:var(--gold);color:#1b1400}
  #keys button.used{opacity:.15}

  .card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:20px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  .row label{flex:0 0 96px;color:var(--dim);font-size:16px}
  .seat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a3566}
  .small{font-size:15px;color:var(--dim)}
  .big{font-size:22px;font-weight:800;color:var(--gold)}
  .center{text-align:center}

  #sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}
  #sheet.hidden{display:none}
  #sheet .in{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 28px);max-height:85vh;overflow:auto}
  #sheet h3{margin:4px 0 10px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#000d;padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;display:none;max-width:90vw;font-size:16px}
  .ver{font-size:11px;color:var(--dim);text-align:center;margin-top:16px}
  .hidden{display:none !important}
  /* wider screens: a little wider, everything a bit tighter, 2-row keyboard */
  @media (min-width:700px){
    #app{max-width:760px;padding-bottom:40px}
    #board{max-width:620px;margin:0 auto}
    .c{font-size:26px}
    #keys{grid-template-columns:repeat(13,1fr);gap:5px}
    #keys button{padding:10px 0;font-size:22px}
    #msg .old{display:block}
    #stripWrap{--sh:96px}
    .bar{flex-basis:54px;font-size:18px;letter-spacing:-3px}
    .bar.word{font-size:10.5px;letter-spacing:-1.5px}
    #frame{width:3px}
  }
  @media (min-width:700px) and (max-height:820px){
    #board{max-width:520px}
    .c{font-size:22px}
  }
</style>
</head>

// ---------- wheel ----------
// 24 wedges, wedge 0 at the top, clockwise. B = Bankrupt, L = Lose a Turn.
function wedges(round) {
  const top = round <= 1 ? 2500 : round === 2 ? 3500 : 5000;
  return [top, 600, 400, 300, 'B', 800, 350, 450, 700, 300, 600, 'L',
          500, 300, 650, 'B', 900, 500, 400, 550, 800, 300, 700, 500];
}
const WEDGE_COLORS = ['#e5484d', '#f59e0b', '#facc15', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];
const VOWELS = 'AEIOU', BONUS_GIVEN = 'RSTLNE', VOWEL_COST = 250, MAX_SEATS = 2;
const BONUS_PRIZES = [25000, 30000, 35000, 40000, 45000, 50000, 100000];

// ---------- device / local state ----------
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let DEV = lsGet('wheelhouse-device');
if (!DEV) { DEV = 'd' + Math.random().toString(36).slice(2, 10); lsSet('wheelhouse-device', DEV); }

let S = null;            // current game state (from server)
let busy = false;        // waiting on a save
let mode = null;         // local UI mode: 'vowel' | null
let bonusSel = [];       // letters picked locally during the bonus round
let spinSeen = -1;       // last spin number already animated
let spinning = false;    // wheel animation running
let stripPos = 24.5;     // which bar (in bar units) sits under the pointer, local only
let lastTurnKey = '';
const MAX_GAMES = 5;
let curSlot = Math.min(Math.max(parseInt(lsGet('wheelhouse-slot') || '0', 10) || 0, 0), MAX_GAMES - 1);
let GAMES = [];          // summaries of every tab's game, from the server
let loaded = false;      // have we heard from the server for this tab yet

const $ = function (id) { return document.getElementById(id); };
const esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
const money = function (n) { return '$' + Number(n || 0).toLocaleString('en-US'); };
const av = function (p) { return window.GamesApp ? esc(GamesApp.avatar(p.dev, p.name)) : ''; };

// ---------- server ----------
// The answer is never saved as plain text: puzzle.text lives only in memory, and the save file
// holds puzzle.enc (the text XORed with a keystream seeded by the game id, then base64).
// Not real security, just enough that peeking at the Drive file doesn't give it away.
function keystream(seed, n) {
  let h = 2166136261;

// ---------- helpers ----------

// Fit a phrase onto the 12/14/14/12 board. Returns 4 rows of 14 cells (null = unused) or null.
function layout(text) {
  const words = text.split(' ');
  const plans = [{ rows: [1], caps: [14] }, { rows: [1, 2], caps: [14, 14] },

      if (!cur) cur = w;
      else if (cur.length + 1 + w.length <= cap) cur += ' ' + w;

// ---------- puzzles ----------
function builtIn(ns, i) {

// ---------- wheel drawing ----------
function drawStrip(round) {

    const v = w[i];
    if (v === 'B') h += '<div class="bar word bk">BANK<br>RUPT</div>';
    else if (v === 'L') h += '<div class="bar word lt">LOSE<br>TURN</div>';
    else h += '<div class="bar' + (v >= 2500 ? ' top' : '') + '"' + (v >= 2500 ? '' : ' style="background:' + WEDGE_COLORS[i % WEDGE_COLORS.length] + '"') + '>' + v + '</div>';
  }

  $('strip').dataset.round = round;
}

  if (animate) { el.style.transition = ''; el.style.transform = 'translateX(' + x + 'px)'; return; }

function setWheel(sp, animate) {

  if (!animate) { stripPos = 24 + target; placeStrip(false); return; }

    const used = S.guessed.indexOf(L) >= 0;
    const sel = opts.sel && opts.sel.indexOf(L) >= 0;
    const allowed = !used && (kind === 'any' || (kind === 'c' && !v) || (kind === 'v' && v));
    return '<button data-l="' + L + '" class="' + (v ? 'v ' : '') + (used ? 'used ' : '') + (sel ? 'sel' : '') + '"' + (allowed && !busy && !spinning ? '' : ' disabled') + '>' + L + '</button>';
  }).join('');
  $('keys').onclick = function (e) { const b = e.target.closest('button'); if (b && !b.disabled) onPick(b.dataset.l); };
}

function renderActions() {
  const a = $('actions'), m = me();
  $('keys').innerHTML = '';
  const dis = busy || spinning ? ' disabled' : '';
  if (m < 0) {
    a.innerHTML = '<div class="note">You\'re watching. If you\'re one of these players (first time in the Games app):</div>' +
      S.players.map(function (p, i) { return '<button data-claim="' + i + '"' + dis + '>I\'m ' + esc(p.name) + '</button>'; }).join('');
    a.onclick = function (e) { const b = e.target.closest('button'); if (b && b.dataset.claim) claimSeat(+b.dataset.claim); };
    return;
  }
  a.onclick = null;
  if (S.status === 'play') {
    const p = S.players[S.turn];
    if (!myTurn()) { a.innerHTML = '<div class="note">Waiting for ' + esc(p.name) + '…</div>'; return; }
    if (S.phase === 'consonant') {
      a.innerHTML = '<div class="note">Pick a consonant. Each one is worth ' + money(S.spinVal) + '.</div>';
      keyboard('c', callConsonant);
      return;
    }
    if (mode === 'vowel') {
      a.innerHTML = '<div class="note">Buy a vowel for ' + money(VOWEL_COST) + '</div><button id="cancel"' + dis + '>Cancel</button>';
      $('cancel').onclick = function () { mode = null; render(); };
      keyboard('v', buyVowel);
      return;
    }
    const cLeft = hiddenLeft('c'), vLeft = hiddenLeft('v');
    a.innerHTML = '<button class="primary" id="bSpin"' + (cLeft ? dis : ' disabled') + '>Spin</button>' +
      '<button id="bVowel"' + (vLeft && p.bank >= VOWEL_COST ? dis : ' disabled') + '>Buy vowel</button>' +
      '<button class="go" id="bSolve"' + dis + '>Solve</button>' +
      (cLeft ? '' : '<div class="note">No consonants left. Buy a vowel or solve.</div>');
    $('bSpin').onclick = spin;
    $('bVowel').onclick = function () { mode = 'vowel'; render(); };
    $('bSolve').onclick = function () { solveSheet(solve); };
    return;
  }
  if (S.status === 'roundEnd') {
    const last = S.round >= S.settings.rounds;
    a.innerHTML = '<div class="note">' + esc(name(S.winner)) + ' won round ' + S.round + '.</div>' +
      '<button class="primary" id="bNext"' + dis + '>' + (last ? 'Start bonus round' : 'Next round') + '</button>';
    $('bNext').onclick = nextRound;
    return;
  }
  if (S.status === 'bonus') {
    const b = S.bonus, who = S.players[b.p];
    if (m !== b.p) { a.innerHTML = '<div class="note">' + esc(who.name) + ' is playing the bonus round. The prize is ' + money(b.prize) + ' if solved.</div>'; return; }
    if (b.stage === 'pick') {
      const c = bonusSel.filter(function (l) { return VOWELS.indexOf(l) < 0; }).length, v = bonusSel.length - c;
      a.innerHTML = '<div class="note">Pick 3 more consonants and 1 vowel (' + c + '/3, ' + v + '/1)</div>' +
        '<button class="primary" id="bLock"' + (c === 3 && v === 1 ? dis : ' disabled') + '>Lock in</button>';
      $('bLock').onclick = bonusLock;
      keyboard('any', function (L) {
        const i = bonusSel.indexOf(L);
        if (i >= 0) bonusSel.splice(i, 1);
        else {
          const isV = VOWELS.indexOf(L) >= 0;
          const have = bonusSel.filter(function (l) { return (VOWELS.indexOf(l) >= 0) === isV; }).length;
          if (have >= (isV ? 1 : 3)) return toast(isV ? 'Only 1 vowel.' : 'Only 3 consonants.');
          bonusSel.push(L);
        }
        render();
      }, { sel: bonusSel });
      return;
    }
    a.innerHTML = '<div class="note">One guess to win the envelope.</div><button class="go" id="bSolve"' + dis + '>Solve</button>';
    $('bSolve').onclick = function () { solveSheet(bonusSolve); };
    return;
  }
  if (S.status === 'over') {
    const ranked = S.players.map(function (p, i) { return { p: p, i: i }; }).sort(function (x, y) { return y.p.total - x.p.total; });
    const b = S.bonus;
    a.innerHTML = '<div class="card" style="width:100%"><h2>Final</h2>' +
      (b ? '<div class="small">' + esc(name(b.p)) + (b.won ? ' won the bonus envelope: ' : ' missed the bonus. The envelope held ') + '<b>' + money(b.prize) + '</b></div>' : '') +
      ranked.map(function (r, k) { return '<div class="seat"><span>' + (k + 1) + '. ' + av(r.p) + esc(r.p.name) + '</span><span class="big">' + money(r.p.total) + '</span></div>'; }).join('') +
      '</div><button class="primary" id="bRe"' + dis + '>Rematch (same players)</button><button id="bNew"' + dis + '>New game</button>';
    $('bRe').onclick = rematch;
    $('bNew').onclick = function () { setupSheet(); };
  }
}

function renderLobby() {
  const L = $('lobby');
  if (!S) {
    L.innerHTML = '<div class="card"><h2>New game</h2><div class="small">Spin the wheel, call letters, solve the puzzle. 2 players, each on their own phone.</div>' + setupForm() + '<button class="primary" id="bCreate" style="width:100%;margin-top:8px">Create game</button></div>';
    bindSetup('bCreate');
    return;
  }
  const m = me(), host = m === 0;
  let h = '<div class="card"><h2>Lobby</h2>' + S.players.map(function (p, i) {
    return '<div class="seat"><span>' + av(p) + esc(p.name) + (i === 0 ? ' <span class="small">(host)</span>' : '') + (i === m ? ' <span class="small">(you)</span>' : '') + '</span></div>';
  }).join('') +
    '<div class="small" style="margin-top:8px">' + S.settings.rounds + ' rounds + bonus · Puzzles: ' + ({ mixed: 'Built-in + online', builtin: 'Built-in', online: 'Online' })[S.settings.source] + '</div></div>';
  if (m < 0 && S.players.length < MAX_SEATS) {
    h += '<div class="card"><h2>Join</h2><div class="small">Joining as <b>' + esc(myName()) + '</b>.</div><button class="primary" id="bJoin" style="width:100%;margin-top:10px">Join game</button></div>';
  } else if (m < 0) {
    h += '<div class="card small">The game is full.</div>';
  }
  if (host) h += '<button class="primary" id="bStart" style="width:100%"' + (S.players.length >= 2 && !busy ? '' : ' disabled') + '>' + (S.players.length >= 2 ? 'Start game' : 'Waiting for the other player to join…') + '</button>';
  else if (m >= 0) h += '<div class="card small center">Waiting for ' + esc(S.players[0].name) + ' to start…</div>';
  h += '<div class="small center" style="margin-top:12px">The other player joins from their Wheelhouse tab.</div>';
  L.innerHTML = h;
  if ($('bJoin')) $('bJoin').onclick = function () { join(myName()); };
  if ($('bStart')) $('bStart').onclick = function () { startRound(next()); };
}

function myName() { return lsGet('wheelhouse-name') || 'Player'; }   // the app login name (shim.js keeps it current)
function setupForm() {
  return '<div class="small" style="margin-bottom:8px">Playing as <b>' + esc(myName()) + '</b>. Tap your avatar at the top right to change your name.</div>' +
    '<div class="row"><label>Rounds</label><select id="sRounds"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>' +
    '<div class="row"><label>Puzzles</label><select id="sSrc"><option value="mixed" selected>Built-in + online</option><option value="builtin">Built-in only</option><option value="online">Online only</option></select></div>';
}
function bindSetup(btnId, after) {
  $(btnId).onclick = function () {
    const n = myName();
    if (after) after();
    newGame(n, { rounds: +$('sRounds').value, source: $('sSrc').value });
  };
}

// ---------- sheets ----------
function openSheet(html) { $('sheetIn').innerHTML = html; $('sheet').classList.remove('hidden'); }
function closeSheet() { $('sheet').classList.add('hidden'); }
$('sheet').onclick = function (e) { if (e.target.id === 'sheet') closeSheet(); };

function solveSheet(fn) {
  openSheet('<h3>Solve the puzzle</h3><div class="small" style="margin-bottom:8px">' + esc(S.puzzle.cat) + '. Spaces and punctuation don\'t matter.</div>' +
    '<input id="solveIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type your answer">' +
    '<div class="row" style="margin-top:12px"><button id="sCancel" style="flex:1">Cancel</button><button class="go" id="sGo" style="flex:2">Solve</button></div>');
  setTimeout(function () { $('solveIn').focus(); }, 50);
  const go = function () { const v = $('solveIn').value.trim(); if (!v) return; closeSheet(); fn(v); };
  $('sGo').onclick = go;
  $('solveIn').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('sCancel').onclick = closeSheet;
}
function setupSheet() {
  openSheet('<h3>Start a new game</h3><div class="small">This replaces the current game for everyone.</div>' + setupForm() +
    '<div class="row" style="margin-top:12px"><button id="nCancel" style="flex:1">Cancel</button><button class="primary" id="nGo" style="flex:2">Create game</button></div>');
  $('nCancel').onclick = closeSheet;
  bindSetup('nGo', closeSheet);
}
function menuSheet() {
  const m = me();
  openSheet('<h3>Wheelhouse</h3>' +
    '<div class="card"><h2>How to play</h2><div class="small">On your turn, <b>Spin</b> and call a consonant: you earn the wedge value for each time it appears. ' +
    '<b>Buy a vowel</b> for $250 from this round\'s money. <b>Solve</b> whenever it\'s your turn. A wrong letter, wrong guess, Bankrupt or Lose a Turn passes play. ' +
    'Bankrupt also wipes your money for the round. The solver banks their round money (at least $1,000). After the last round, the leader plays the bonus round: R S T L N E are given, pick 3 consonants and a vowel, then make one guess.</div></div>' +
    (S && S.log ? '<div class="card"><h2>Recent</h2>' + S.log.map(function (l) { return '<div class="small">' + esc(l) + '</div>'; }).join('') + '</div>' : '') +
    '<button id="mNew" style="width:100%;margin-bottom:10px">Start a new game in this tab</button>' +
    (S ? '<button id="mClose2" style="width:100%;margin-bottom:10px">Close this game</button>' : '') +
    '<div class="card"><h2>Version history</h2>' + VERSIONS.map(function (v) { return '<div class="small" style="margin-bottom:6px"><b>' + v[0] + '</b> (' + v[1] + '): ' + esc(v[2]) + '</div>'; }).join('') + '</div>' +
    '<button id="mClose" style="width:100%">Close</button>');
  $('mNew').onclick = function () { closeSheet(); setTimeout(setupSheet, 50); };
  if ($('mClose2')) $('mClose2').onclick = function () {
    openSheet('<h3>Close this game?</h3><div class="small">It ends for everyone and the tab is freed. This can\'t be undone.</div>' +
      '<div class="row" style="margin-top:12px"><button id="cNo" style="flex:1">Keep it</button><button class="primary" id="cYes" style="flex:1">Close game</button></div>');
    $('cNo').onclick = closeSheet;
    $('cYes').onclick = function () { closeSheet(); closeGame(); };
  };
  $('mClose').onclick = closeSheet;
}
$('menuBtn').onclick = menuSheet;

function toast(t) {
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 2600);
}
function buzzIfMyTurn() {
  const key = S && (S.gid + ':' + S.turn + ':' + S.round + ':' + S.status);
  const mine = myTurn() || (S && S.status === 'bonus' && S.bonus && S.bonus.p === me() && S.bonus.stage !== 'done');
  if (mine && key !== lastTurnKey && lastTurnKey && navigator.vibrate) navigator.vibrate(120);
  lastTurnKey = key || '';
}

// ---------- start ----------
drawStrip(1);
render();
window.addEventListener('gamesprofiles', function () { if (S && window.GamesApp) GamesApp.fixNames(S.players); renderTabs(); if (S && S.status !== 'lobby') renderPlayers(); else render(); });
store.get(function (st) { if (st !== undefined) apply(st); else toast('Could not load the game.'); });
setInterval(poll, 4000);
document.addEventListener('visibilitychange', poll);
</script>
</body>
</html>
