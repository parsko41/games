<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cipher Strike</title>
<style>
  :root{
    --bg:#10162b; --panel:#1a2342; --panel2:#222d55; --ink:#eef1ff; --dim:#9aa4c9;
    --gold:#ffcf4a; --ok:#35c46a; --red:#e5484d;
    --hit:#2fa35a; --near:#d4a72c; --miss:#3a4166; --fog:#5b3f8f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--panel2);cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:var(--gold);color:#1b1400;font-weight:700}
  button.go{background:var(--ok);color:#04210f;font-weight:700}
  #app{max-width:560px;margin:0 auto;padding:6px 10px calc(env(safe-area-inset-bottom) + 28px)}
  header{display:flex;align-items:center;gap:6px;margin-bottom:6px;min-height:36px}
  header #ver{font-size:11px;color:var(--dim);white-space:nowrap}
  header #menuBtn{padding:4px 8px;font-size:20px;background:transparent;margin-left:0}

  /* tabs: Game 1-5, evenly spread so all five fit without scrolling */
  #tabs{display:flex;gap:5px;flex:1;min-width:0}
  #tabs button{flex:1 1 0;min-width:0;padding:10px 0 4px;border-radius:10px;font-size:13px;font-weight:700;background:var(--panel);color:var(--dim);position:relative;white-space:nowrap;text-align:center}
  #tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
  #tabs button .dot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
  #tabs button .chk{position:absolute;top:0;right:3px;font-size:10px}
  #tabs button.add{flex:0 0 38px;font-weight:800;color:var(--gold)}

  /* players: score and Sabotage Points */
  #players{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 6px}
  .p{background:var(--panel);border-radius:10px;padding:4px 8px;border:2px solid transparent;min-width:0;line-height:1.25}
  .p.on{border-color:var(--gold);background:#2a2a46}
  .p .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
  .p .bk{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .p .sc{font-size:20px;font-weight:800;color:var(--gold)}
  .p .sp{font-size:14px;color:var(--dim);white-space:nowrap}
  .p.me .nm::after{content:" (you)";color:var(--dim);font-weight:400;font-size:13px}

  #msg{background:var(--panel);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:16px;line-height:1.3}
  #msg.alert{background:#3a2552}

  /* Attack / Defend */
  #views{display:flex;gap:4px;background:var(--panel);border-radius:12px;padding:4px;margin-bottom:6px}
  #views button{flex:1;padding:8px 4px;border-radius:9px;background:transparent;color:var(--dim);font-weight:700;font-size:16px;position:relative}
  #views button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
  #views button .dot{position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--gold)}

  /* guess rows */
  #hist{max-height:calc(100vh - 470px);min-height:52px;overflow:auto;padding:2px 0}
  .gr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:300px;margin:0 auto 5px}
  .t{aspect-ratio:1;max-height:52px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;background:var(--miss);position:relative}
  .t.g{background:var(--hit)}
  .t.y{background:var(--near)}
  .t.h{background:var(--fog)}
  .t.h::after{content:"?";position:absolute;right:4px;bottom:1px;font-size:11px;color:#fffa}
  .t.e{background:transparent;box-shadow:inset 0 0 0 2px #34407a}
  .t.e.on{box-shadow:inset 0 0 0 2px var(--gold)}
  .t.cur{box-shadow:inset 0 0 0 2px #6a77b5}
  .gr.typing .t{font-size:24px}
  .gnote{text-align:center;font-size:13px;color:var(--dim);margin:-2px 0 6px}
  .leaks{text-align:center;font-size:15px;margin:2px 0 6px}
  .chip{display:inline-block;background:var(--near);color:#1b1400;font-weight:800;border-radius:6px;padding:0 7px;margin:0 2px}

  /* keyboard */
  #keys{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  #keys .kr{display:flex;gap:4px;justify-content:center}
  #keys button{flex:1 1 0;min-width:0;padding:12px 0;font-weight:800;font-size:19px;border-radius:7px;background:#46518a}
  #keys button.wide{flex:1.6 1 0;font-size:15px}
  #keys button.g{background:var(--hit)}
  #keys button.y{background:var(--near);color:#1b1400}
  #keys button.x{background:#262d4f;color:#7c86ad}
  #keys button.leak{box-shadow:inset 0 0 0 3px var(--near)}
  #keys button.go{background:var(--ok);color:#04210f}

  /* defend view */
  .secret .t{background:#2c3a78}
  .mini .gr{max-width:210px;gap:4px;margin-bottom:4px}
  .mini .t{font-size:17px;border-radius:5px}
  .shop{display:flex;gap:8px;margin-top:6px}
  .shop button{flex:1;text-align:left;padding:10px 12px;line-height:1.25}
  .shop button b{display:block;font-size:17px}
  .shop button span{font-size:13px;color:var(--dim)}
  .shop button .cost{float:right;color:var(--gold);font-weight:800;font-size:15px}

  .card{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .card h2{margin:0 0 8px;font-size:18px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  .seat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a3566}
  .small{font-size:15px;color:var(--dim)}
  .big{font-size:22px;font-weight:800;color:var(--gold)}
  .center{text-align:center}
  #actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
  #actions button{flex:1 1 40%;min-width:120px}
  #actions .note{width:100%;text-align:center;color:var(--dim);font-size:16px}

  #sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}
  #sheet.hidden{display:none}
  #sheet .in{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 28px);max-height:85vh;overflow:auto}
  #sheet h3{margin:4px 0 10px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#000d;padding:10px 14px;border-radius:10px;z-index:20;display:none;max-width:90vw;font-size:16px}
  .hidden{display:none !important}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="tabs"></div>
    <small id="ver"></small>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </header>
  <div id="lobby"></div>
  <div id="game" class="hidden">
    <div id="players"></div>
    <div id="msg"></div>
    <div id="views"><button data-v="attack">⚔️ Attack</button><button data-v="defend">🛡️ Defend</button></div>
    <div id="body"></div>
    <div id="actions"></div>
    <div id="keys"></div>
  </div>
</div>
<div id="sheet" class="hidden"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>

<script src="../config.js"></script>
<script src="../shim.js" data-game="cipher"></script>
<script>
// ---------- versions (bump on every change) ----------
const VERSIONS = [
  ['1.0', '2026-11-01', 'First version: each player picks a secret 5-letter word, then you take turns guessing each other\'s word with Wordle-style colors. Earn a Sabotage Point every turn and spend it on a Smoke Screen (hides a color in their next guess) or a Data Leak (shows you a letter of their word and scrambles their guess list for a turn). First to crack the other word wins. Secret words are scrambled in the save file.']
];

// ---------- rules ----------
const LEN = 5, MAX_SEATS = 2;
const START = 10000, PER_TURN = 500, STRIKE = 2000, UNDER_FIRE = 1000;
const SMOKE_COST = 1, LEAK_COST = 3, MAX_SMOKE = 3;

// ---------- device / local state ----------
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let DEV = lsGet('cipher-device');
if (!DEV) { DEV = 'd' + Math.random().toString(36).slice(2, 10); lsSet('cipher-device', DEV); }

let S = null;            // current game state (from server)
let busy = false;        // waiting on a save
let typed = '';          // letters typed for the guess or secret word (local only)
let view = 'attack';     // 'attack' | 'defend' (local only)
let lastTurnKey = '';
const MAX_GAMES = 5;
let curSlot = Math.min(Math.max(parseInt(lsGet('cipher-slot') || '0', 10) || 0, 0), MAX_GAMES - 1);
let GAMES = [];          // summaries of every tab's game, from the server
let loaded = false;      // have we heard from the server for this tab yet

const $ = function (id) { return document.getElementById(id); };
const esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
const num = function (n) { return Number(n || 0).toLocaleString('en-US'); };
const av = function (p) { return window.GamesApp ? esc(GamesApp.avatar(p.dev, p.name)) : ''; };

// ---------- word list ----------
// The same list as Tilework (Collins + NASPA), shared on the phone with Tilework's copy.
let DICT = null;
const WORDS_CACHE = 'tilework-words-1';
function decodeWords(t) { const s = new Set(); let prev = ''; t.split(/\r?\n/).forEach(function (line) { if (!line) return; const w = prev.slice(0, parseInt(line[0], 16)) + line.slice(1); if (w.length === LEN) s.add(w); prev = w; }); return s; }
function loadWords() {
  let t = null;
  try { t = localStorage.getItem(WORDS_CACHE); } catch (e) {}
  const done = function (t) {
    const d = t ? decodeWords(t) : null;
    DICT = d && d.size > 5000 ? d : 'off';
    if (DICT === 'off') toast('Couldn\'t load the word list, so words won\'t be checked this time.');
    render();
  };
  if (t) return setTimeout(function () { done(t); }, 0);
  google.script.run.withSuccessHandler(function (x) {
    if (x) { try { localStorage.setItem(WORDS_CACHE, x); } catch (e) {} }
    done(x || null);
  }).withFailureHandler(function () { done(null); }).getWords();
}
function isWord(w) { return DICT === 'off' || (DICT && DICT.has(w)); }

// ---------- server ----------
// Secret words are never saved as plain text: secret (and the letters leaked from it) live only
// in memory, and the save file holds enc (XORed with a keystream seeded by the game id, then base64).
// Not real security, just enough that peeking at the Drive file doesn't give it away.
function keystream(seed, n) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const out = [];
  for (let i = 0; i < n; i++) { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; out.push(h & 255); }
  return out;
}
function encText(t, seed) {
  const k = keystream('cs:' + seed, t.length);
  let b = '';
  for (let i = 0; i < t.length; i++) b += String.fromCharCode((t.charCodeAt(i) & 255) ^ k[i]);
  return btoa(b);
}
function decText(e, seed) {
  const b = atob(e), k = keystream('cs:' + seed, b.length);
  let t = '';
  for (let i = 0; i < b.length; i++) t += String.fromCharCode(b.charCodeAt(i) ^ k[i]);
  return t;
}
function hide(ns) {           // copy for saving: secrets and leaks encoded, plain text dropped
  const out = JSON.parse(JSON.stringify(ns));
  (out.players || []).forEach(function (p, i) {
    if (typeof p.secret === 'string') { p.enc = encText(p.secret, out.gid + ':' + i); delete p.secret; }
    if (Array.isArray(p.leaks)) { p.leakEnc = encText(p.leaks.join(','), out.gid + ':L' + i); delete p.leaks; }
  });
  return out;
}
function reveal(st) {         // after loading: decode secrets and leaks, and use current login names
  if (st && window.GamesApp) GamesApp.fixNames(st.players);
  ((st && st.players) || []).forEach(function (p, i) {
    if (p.enc && typeof p.secret !== 'string') { try { p.secret = decText(p.enc, st.gid + ':' + i); } catch (e) { p.secret = ''; } }
    if (!Array.isArray(p.leaks)) { try { p.leaks = p.leakEnc ? decText(p.leakEnc, st.gid + ':L' + i).split(',') : []; } catch (e) { p.leaks = []; } }
  });
  return st;
}

// Every call is tagged with the tab it was for; answers for a tab we've since left are ignored.
const store = {
  get: function (cb) {
    const slot = curSlot;
    google.script.run.withSuccessHandler(function (r) { if (slot !== curSlot) return; GAMES = r.games || GAMES; cb(reveal(r.state)); })
      .withFailureHandler(function (e) { if (slot === curSlot) cb(undefined, e); }).getState(slot);
  },
  save: function (ns, cb) {
    const slot = curSlot;
    google.script.run.withSuccessHandler(function (r) { GAMES = r.games || GAMES; if (slot !== curSlot) { busy = false; renderTabs(); return; } cb(r.ok, reveal(r.state)); })
      .withFailureHandler(function (e) { toast('Save failed: ' + (e && e.message || e)); cb(false, undefined); })
      .saveState(JSON.stringify(hide(ns)), slot);
  },
  close: function (gid, cb) {
    const slot = curSlot;
    google.script.run.withSuccessHandler(function (r) { GAMES = r.games || GAMES; if (slot === curSlot) cb(reveal(r.state)); else renderTabs(); })
      .withFailureHandler(function (e) { toast('Could not close: ' + (e && e.message || e)); }).closeGame(slot, gid);
  }
};

// redo (optional) rebuilds the move on the fresh game when the other phone saved first.
// Used for picking secret words, which both players do at the same time.
function commit(ns, after, redo) {
  if (busy) return;
  busy = true; render();
  store.save(ns, function (ok, saved) {
    busy = false;
    if (!ok && saved !== undefined && redo) { apply(saved); const again = redo(); if (again) return commit(again, after); return; }
    if (!ok && saved !== undefined) toast('Someone moved first, so the game refreshed.');
    if (saved !== undefined) apply(saved);
    else render();
    if (ok && after) after();
  });
}

function switchTab(i) {
  if (i === curSlot || busy) return;
  curSlot = i; lsSet('cipher-slot', String(i));
  S = null; loaded = false; typed = ''; view = 'attack'; lastTurnKey = '';
  closeSheet();
  render();
  store.get(function (st) { if (st !== undefined) apply(st); });
}
function tabInfo(g) {
  if (!g) return { label: 'New game', dot: false };
  if (window.GamesApp) g = Object.assign({}, g, { names: g.names.map(function (n, i) { return GamesApp.nameOf(g.devs[i], n); }) });
  const mine = g.devs.indexOf(DEV) >= 0;
  if (g.status === 'lobby') return mine ? { label: 'Lobby ' + g.names.length + '/' + MAX_SEATS, dot: false } : { label: 'Join ' + g.names[0], dot: g.names.length < MAX_SEATS };
  const others = g.names.filter(function (n, i) { return g.devs[i] !== DEV; });
  const label = mine ? 'vs ' + others.join(' & ') : g.names.join(' & ');
  const dot = mine && String(g.act || '').split(',').indexOf(DEV) >= 0;
  return { label: label, dot: dot, over: g.status === 'over' };
}
function renderTabs() {
  const used = [];
  for (let i = 0; i < MAX_GAMES; i++) if (GAMES[i] || i === curSlot) used.push(i);
  const free = GAMES.length ? (function () { for (let i = 0; i < MAX_GAMES; i++) if (!GAMES[i] && i !== curSlot) return i; return -1; })() : -1;
  $('tabs').innerHTML = used.map(function (i) {
    const t = tabInfo(i === curSlot && loaded ? (S ? { devs: S.players.map(function (p) { return p.dev; }), names: S.players.map(function (p) { return p.name; }), status: S.status, act: (GAMES[i] || {}).act } : null) : GAMES[i]);
    return '<button data-tab="' + i + '" class="' + (i === curSlot ? 'on' : '') + '" title="' + esc(t.label) + '" aria-label="Game ' + (i + 1) + ': ' + esc(t.label) + (t.dot ? ', your move' : '') + '">Game ' + (i + 1) + (t.over ? '<span class="chk">✓</span>' : '') + (t.dot && i !== curSlot ? '<span class="dot"></span>' : '') + '</button>';
  }).join('') + (free >= 0 && GAMES[curSlot] ? '<button class="add" data-tab="' + free + '" title="Start another game">+</button>' : '');
}
$('tabs').onclick = function (e) { const b = e.target.closest('button'); if (b) switchTab(+b.dataset.tab); };

function next() {           // copy of S with moveNo bumped
  const ns = JSON.parse(JSON.stringify(S));
  ns.moveNo = S.moveNo + 1;
  return ns;
}

function poll() {
  if (busy || document.hidden) return;
  store.get(function (st) { if (st !== undefined && !busy) apply(st); });
}

function apply(st) {
  const firstLoad = !loaded;
  const changed = firstLoad || (!S !== !st) || (S && st && (st.gid !== S.gid || st.moveNo !== S.moveNo));
  const turnMoved = !S || !st || S.gid !== st.gid || S.status !== st.status || S.turn !== st.turn;
  loaded = true;
  S = st;
  renderTabs();
  if (!changed) return;
  if (turnMoved) typed = '';
  render();
  buzzIfMyTurn();
}

// ---------- helpers ----------
function me() { return S && S.players ? S.players.findIndex(function (p) { return p.dev === DEV; }) : -1; }
function myTurn() { return S && S.status === 'play' && me() === S.turn; }
function name(i) { return S.players[i] ? S.players[i].name : '?'; }
function hasSecret(p) { return !!(p && typeof p.secret === 'string' && p.secret.length === LEN); }
function addLog(ns, line) { ns.log = [line].concat(ns.log || []).slice(0, 10); }
function newGid() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function freshSeat(dev, nm) { return { dev: dev, name: nm, score: START, sp: 0, guesses: [], fx: { smoke: 0, scramble: false }, leaks: [] }; }

// Wordle colors for a guess: g = right letter, right spot; y = in the word, wrong spot; x = not in it.
function colors(guess, secret) {
  const out = ['x', 'x', 'x', 'x', 'x'], left = {};
  for (let i = 0; i < LEN; i++) {
    if (guess[i] === secret[i]) out[i] = 'g';
    else left[secret[i]] = (left[secret[i]] || 0) + 1;
  }
  for (let i = 0; i < LEN; i++) {
    if (out[i] !== 'g' && left[guess[i]]) { out[i] = 'y'; left[guess[i]]--; }
  }
  return out.join('');
}
// Shuffles a list the same way every time for the same seed (so a scrambled list stays put while you look).
function seeded(list, seed) {
  const k = keystream('mix:' + seed, list.length), out = list.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = k[i] % (i + 1); const t = out[i]; out[i] = out[j]; out[j] = t; }
  return out;
}

// ---------- actions ----------
function newGame(nm) {
  const ns = {
    app: 'cipher', gid: newGid(), moveNo: 0, status: 'lobby',
    players: [freshSeat(DEV, nm)], turn: 0, winner: -1, log: [nm + ' started a new game.'], moves: [], endNote: ''
  };
  commit(ns);
}
function closeGame() {
  if (!S || busy) return;
  busy = true; render();
  store.close(S.gid, function (st) { busy = false; apply(st); toast('Game closed. This tab is free.'); });
}
function join(nm) {
  if (S.players.length >= MAX_SEATS) return;
  const ns = next();
  ns.players.push(freshSeat(DEV, nm));
  ns.status = 'setup';
  addLog(ns, nm + ' joined. Both players pick a secret word.');
  commit(ns);
}
function claimSeat(i) {
  const ns = next();
  ns.players[i].dev = DEV;
  addLog(ns, ns.players[i].name + ' is now playing on this phone.');
  commit(ns);
}
function rematch() {
  const ns = next();
  ns.gid = newGid(); ns.moveNo = 0;
  ns.players = ns.players.map(function (p) { return freshSeat(p.dev, p.name); });
  ns.status = 'setup'; ns.turn = 0; ns.winner = -1; ns.log = []; ns.moves = []; ns.endNote = '';
  addLog(ns, 'Rematch! Both players pick a new secret word.');
  commit(ns);
}

// Store this phone's secret word. When both are in, the game starts with a random first guesser.
function setSecret(w) {
  const build = function () {
    const m = me();
    if (!S || S.status !== 'setup' || m < 0 || hasSecret(S.players[m])) return null;
    const ns = next();
    ns.players[m].secret = w;
    addLog(ns, ns.players[m].name + ' locked in a secret word.');
    if (ns.players.length === MAX_SEATS && ns.players.every(hasSecret)) {
      ns.status = 'play';
      ns.turn = Math.floor(Math.random() * ns.players.length);
      addLog(ns, 'Both words are locked in. ' + ns.players[ns.turn].name + ' guesses first.');
    }
    return ns;
  };
  const ns = build();
  if (!ns) return;
  typed = '';
  commit(ns, null, build);
}

function guess(w) {
  if (!myTurn() || busy) return;
  const ns = next(), m = ns.turn, opp = 1 - m, p = ns.players[m], o = ns.players[opp];
  const fx = p.fx || { smoke: 0, scramble: false };
  let f = colors(w, o.secret).split('');
  const hidden = [];
  if (fx.smoke > 0 && w !== o.secret) {   // a Smoke Screen hides one color per screen, in random spots
    const spots = seeded([0, 1, 2, 3, 4], ns.gid + ':' + ns.moveNo).slice(0, Math.min(fx.smoke, LEN - 1));
    spots.forEach(function (i) { f[i] = 'h'; hidden.push(i); });
  }
  const under = fx.smoke > 0 || fx.scramble;
  p.guesses = (p.guesses || []).concat([{ w: w, f: f.join(''), n: hidden.length, s: fx.scramble ? 1 : 0 }]);
  p.score = Math.max(0, p.score - PER_TURN);
  p.sp = (p.sp || 0) + 1;
  p.fx = { smoke: 0, scramble: false };
  const pattern = f.map(function (c) { return { g: '🟩', y: '🟨', x: '⬛', h: '🟪' }[c]; }).join('');
  ns.moves = (ns.moves || []).concat([{ p: m, t: w + ' ' + pattern }]);   // every guess, for the Winners' Log
  typed = '';
  if (w === o.secret) {
    p.score += STRIKE + (under ? UNDER_FIRE : 0);
    ns.status = 'over'; ns.winner = m;
    ns.endNote = p.name + ' cracked ' + o.name + '\'s word ' + o.secret + ' in ' + p.guesses.length + ' guess' + (p.guesses.length === 1 ? '' : 'es') +
      (under ? ', under sabotage (+' + num(UNDER_FIRE) + ' bonus)' : '') + '!';
    addLog(ns, ns.endNote);
  } else {
    addLog(ns, p.name + ' guessed ' + w + ' ' + pattern + (hidden.length ? ' (smoke hid ' + hidden.length + ')' : '') + '.');
    ns.turn = opp;
  }
  commit(ns);
}

// Sabotage: bought on your turn, before you guess. Saved right away; the turn doesn't pass.
function buySmoke() {
  if (!myTurn() || busy) return;
  const ns = next(), m = ns.turn, p = ns.players[m], o = ns.players[1 - m];
  if ((p.sp || 0) < SMOKE_COST || (o.fx.smoke || 0) >= MAX_SMOKE) return;
  p.sp -= SMOKE_COST;
  o.fx.smoke = (o.fx.smoke || 0) + 1;
  addLog(ns, p.name + ' threw a Smoke Screen at ' + o.name + '.');
  commit(ns, function () { toast('Smoke Screen set: ' + o.name + '\'s next guess hides ' + o.fx.smoke + ' color' + (o.fx.smoke === 1 ? '' : 's') + '.'); });
}
// What a Data Leak can show: a letter of the other word you haven't tried yet ('A'), or, once you've
// tried them all, a letter in a spot you haven't solved ('A3' = A is letter 3).
function leakable(m) {
  const p = S.players[m], o = S.players[1 - m], leaks = p.leaks || [];
  const tried = (p.guesses || []).map(function (g) { return g.w; }).join('') + leaks.map(function (x) { return x[0]; }).join('');
  const letters = o.secret.split('').filter(function (c, i, a) { return a.indexOf(c) === i && tried.indexOf(c) < 0; });
  if (letters.length) return letters;
  const solved = function (i) {
    return (p.guesses || []).some(function (g) { return g.f[i] === 'g'; }) || leaks.indexOf(o.secret[i] + (i + 1)) >= 0;
  };
  return o.secret.split('').map(function (c, i) { return c + (i + 1); }).filter(function (x, i) { return !solved(i); });
}
function leakText(x) { return x.length > 1 ? x[0] + ' is letter ' + x.slice(1) : x; }
function buyLeak() {
  if (!myTurn() || busy) return;
  const m = me(), pool = leakable(m);
  if ((S.players[m].sp || 0) < LEAK_COST || !pool.length) return;
  const ns = next(), p = ns.players[m], o = ns.players[1 - m];
  const L = pool[Math.floor(Math.random() * pool.length)];
  p.sp -= LEAK_COST;
  p.leaks = (p.leaks || []).concat([L]);
  o.fx.scramble = true;
  addLog(ns, p.name + ' ran a Data Leak on ' + o.name + '.');
  commit(ns, function () { toast('Data Leak: ' + (L.length > 1 ? leakText(L) : 'the word has a ' + L) + '. ' + o.name + '\'s guess list is scrambled for a turn.'); view = 'attack'; render(); });
}

// ---------- keyboard ----------
const ROWS = ['QWERTYUIOP', 'ASDFGHJKL', '>ZXCVBNM<'];
function keyStates() {        // best color seen for each letter in my own guesses
  const m = me(), out = {};
  if (m < 0 || S.status === 'setup') return out;
  const rank = { x: 1, y: 2, g: 3 };
  (S.players[m].guesses || []).forEach(function (g) {
    for (let i = 0; i < LEN; i++) { const c = g.f[i], L = g.w[i]; if (rank[c] && (!out[L] || rank[c] > rank[out[L]])) out[L] = c; }
  });
  (S.players[m].leaks || []).forEach(function (x) { if (!out[x[0]]) out[x[0]] = 'leak'; });   // in the word
  return out;
}
function renderKeys(on) {
  if (!on) { $('keys').innerHTML = ''; return; }
  const st = keyStates(), full = typed.length === LEN, dis = busy ? ' disabled' : '';
  $('keys').innerHTML = ROWS.map(function (r) {
    return '<div class="kr">' + r.split('').map(function (L) {
      if (L === '>') return '<button class="wide' + (full ? ' go' : '') + '" data-k="Enter"' + (full ? dis : ' disabled') + '>Enter</button>';
      if (L === '<') return '<button class="wide" data-k="Backspace"' + (typed ? dis : ' disabled') + ' aria-label="Delete">⌫</button>';
      return '<button data-k="' + L + '" class="' + (st[L] || '') + '"' + dis + '>' + L + '</button>';
    }).join('') + '</div>';
  }).join('');
}
function press(k) {
  if (busy) return;
  const setup = S && S.status === 'setup';
  if (!setup && !myTurn()) return;
  if (k === 'Backspace') typed = typed.slice(0, -1);
  else if (k === 'Enter') return submitTyped();
  else if (/^[A-Z]$/.test(k) && typed.length < LEN) typed += k;
  else return;
  render();
}
function submitTyped() {
  const w = typed;
  if (w.length !== LEN) return toast(LEN + ' letters, please.');
  if (!DICT) return toast('Still loading the word list…');
  if (!isWord(w)) return toast(w + ' isn\'t in the word list.');
  if (S.status === 'setup') return setSecret(w);
  const mine = S.players[me()].guesses || [];
  if (mine.some(function (g) { return g.w === w; })) return toast('You already guessed ' + w + '.');
  guess(w);
}
$('keys').onclick = function (e) { const b = e.target.closest('button'); if (b && !b.disabled) press(b.dataset.k); };
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey || !$('sheet').classList.contains('hidden')) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (/^[A-Z]$/.test(k) || k === 'Enter' || k === 'Backspace') { press(k); e.preventDefault(); }
});

// ---------- render ----------
function render() {
  $('ver').textContent = 'v' + VERSIONS[0][0];
  renderTabs();
  if (!S || S.status === 'lobby') { $('lobby').classList.remove('hidden'); $('game').classList.add('hidden'); renderLobby(); return; }
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  const m = me();
  renderPlayers(); renderMsg();
  const showViews = S.status === 'play' && m >= 0;
  $('views').classList.toggle('hidden', !showViews);
  if (!showViews) view = 'attack';
  document.querySelectorAll('#views button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === view);
    const d = b.querySelector('.dot');
    const want = b.dataset.v === 'defend' && myTurn() && (S.players[m].sp || 0) >= SMOKE_COST && view !== 'defend';
    if (want && !d) { const x = document.createElement('span'); x.className = 'dot'; b.appendChild(x); }
    if (!want && d) d.remove();
  });
  if (S.status === 'setup') renderSetup();
  else if (S.status === 'over') renderOver();
  else if (view === 'defend' && m >= 0) renderDefend();
  else renderAttack();
}
$('views').onclick = function (e) { const b = e.target.closest('button'); if (b) { view = b.dataset.v; render(); } };

function renderPlayers() {
  const m = me();
  $('players').innerHTML = S.players.map(function (p, i) {
    const on = S.status === 'play' && S.turn === i;
    return '<div class="p' + (on ? ' on' : '') + (i === m ? ' me' : '') + '"><div class="nm">' + av(p) + esc(p.name) + '</div>' +
      '<div class="bk"><span class="sc">' + num(p.score) + '</span><span class="sp" title="Sabotage Points">⚡ ' + (p.sp || 0) + '</span></div></div>';
  }).join('') + (S.players.length < 2 ? '<div class="p"><div class="nm small">Waiting…</div></div>' : '');
}

function renderMsg() {
  const m = me(), el = $('msg');
  let t, alert = false;
  if (S.status === 'setup') {
    if (m < 0) t = 'The players are picking their secret words.';
    else if (!hasSecret(S.players[m])) t = 'Pick your secret ' + LEN + '-letter word. ' + name(1 - m) + ' will try to crack it.';
    else t = 'Your word is locked in. Waiting for ' + name(1 - m) + ' to pick theirs…';
  } else if (S.status === 'over') t = S.endNote || 'Game over.';
  else if (m < 0) t = 'You\'re watching.';
  else if (myTurn()) {
    const fx = S.players[m].fx || {};
    const hits = [];
    if (fx.smoke) hits.push('a Smoke Screen hides ' + fx.smoke + ' color' + (fx.smoke === 1 ? '' : 's') + ' of this guess');
    if (fx.scramble) hits.push('a Data Leak scrambled your guess list');
    alert = hits.length > 0;
    t = alert ? '⚠️ Sabotaged: ' + hits.join(' and ') + '.' : 'Your turn: guess ' + name(1 - m) + '\'s word.';
  } else t = 'Waiting for ' + name(S.turn) + ' to guess…';
  el.textContent = t;
  el.classList.toggle('alert', alert);
}

function tiles(word, cls, extra) {
  return '<div class="gr' + (extra || '') + '">' + [0, 1, 2, 3, 4].map(function (i) {
    const c = cls ? cls[i] : 'e';
    return '<div class="t ' + c + '">' + esc((word || '')[i] || '') + '</div>';
  }).join('') + '</div>';
}
function typingRow(on) {
  return '<div class="gr typing">' + [0, 1, 2, 3, 4].map(function (i) {
    return '<div class="t e' + (on && i === typed.length ? ' on' : '') + (typed[i] ? ' cur' : '') + '">' + esc(typed[i] || '') + '</div>';
  }).join('') + '</div>';
}

function renderAttack() {
  const m = me(), a = $('actions');
  a.innerHTML = ''; a.onclick = null;
  if (m < 0) {
    a.innerHTML = '<div class="note">If you\'re one of these players (first time in the Games app):</div>' +
      S.players.map(function (p, i) { return '<button data-claim="' + i + '"' + (busy ? ' disabled' : '') + '>I\'m ' + esc(p.name) + '</button>'; }).join('');
    a.onclick = function (e) { const b = e.target.closest('button'); if (b && b.dataset.claim) claimSeat(+b.dataset.claim); };
    $('body').innerHTML = '';
    renderKeys(false);
    return;
  }
  const p = S.players[m];
  let list = p.guesses || [];
  const scrambled = p.fx && p.fx.scramble && myTurn();
  if (scrambled) list = seeded(list, S.gid + ':' + list.length);
  let h = '';
  if (p.leaks && p.leaks.length) h += '<div class="leaks">Leaked: ' + p.leaks.map(function (x) { return '<span class="chip">' + esc(leakText(x)) + '</span>'; }).join('') + '</div>';
  h += '<div id="hist">' + (list.length ? '' : '<div class="gnote">No guesses yet.</div>') +
    list.map(function (g) { return tiles(g.w, g.f.split('')); }).join('') +
    (myTurn() ? typingRow(true) : '') + '</div>';
  if (scrambled) h += '<div class="gnote">🔀 Scrambled: these are out of order this turn.</div>';
  $('body').innerHTML = h;
  const hist = $('hist'); hist.scrollTop = hist.scrollHeight;
  renderKeys(myTurn());
}

function renderDefend() {
  const m = me(), p = S.players[m], o = S.players[1 - m], a = $('actions');
  a.innerHTML = ''; a.onclick = null;
  const ofx = o.fx || {};
  let h = '<div class="card"><h2>Your secret word</h2><div class="secret">' + tiles(p.secret, ['e', 'e', 'e', 'e', 'e']) + '</div>';
  const pend = [];
  if (ofx.smoke) pend.push('🌫️ ' + ofx.smoke + ' color' + (ofx.smoke === 1 ? '' : 's') + ' hidden');
  if (ofx.scramble) pend.push('🔀 list scrambled');
  h += '<div class="small center">' + (pend.length ? esc(o.name) + '\'s next guess: ' + pend.join(', ') : 'No sabotage waiting for ' + esc(o.name) + '.') + '</div></div>';
  const mine = myTurn(), sp = p.sp || 0, pool = leakable(m), dis = busy ? ' disabled' : '';
  h += '<div class="card"><h2>Sabotage shop · ⚡ ' + sp + '</h2><div class="small">You earn 1 point each turn. Buy before you guess.</div><div class="shop">' +
    '<button id="bSmoke"' + (mine && sp >= SMOKE_COST && (ofx.smoke || 0) < MAX_SMOKE ? dis : ' disabled') + '><span class="cost">⚡' + SMOKE_COST + '</span><b>🌫️ Smoke Screen</b><span>Hides the color of one letter in their next guess.</span></button>' +
    '<button id="bLeak"' + (mine && sp >= LEAK_COST && pool.length ? dis : ' disabled') + '><span class="cost">⚡' + LEAK_COST + '</span><b>🔓 Data Leak</b><span>Shows you a letter of their word and scrambles their guess list for a turn.</span></button>' +
    '</div>' + (mine ? '' : '<div class="small" style="margin-top:6px">The shop opens on your turn.</div>') + '</div>';
  const theirs = o.guesses || [];
  h += '<div class="card mini"><h2>' + esc(o.name) + '\'s guesses at your word</h2>' + (theirs.length ? theirs.map(function (g) {
    const real = colors(g.w, p.secret).split('');
    return tiles(g.w, real.map(function (c, i) { return g.f[i] === 'h' ? 'h' : c; }));   // purple = hidden from them by your smoke
  }).join('') : '<div class="small">None yet.</div>') + '</div>';
  $('body').innerHTML = h;
  $('bSmoke').onclick = buySmoke;
  $('bLeak').onclick = buyLeak;
  renderKeys(false);
}

function renderSetup() {
  const m = me(), a = $('actions');
  a.innerHTML = ''; a.onclick = null;
  if (m < 0) { renderAttack(); return; }
  const p = S.players[m];
  if (hasSecret(p)) {
    $('body').innerHTML = '<div class="card center"><h2>Your secret word</h2><div class="secret">' + tiles(p.secret, ['e', 'e', 'e', 'e', 'e']) + '</div><div class="small">Waiting for ' + esc(name(1 - m)) + '…</div></div>';
    renderKeys(false);
    return;
  }
  $('body').innerHTML = '<div class="card center"><h2>Pick your secret word</h2>' + typingRow(true) +
    '<div class="small">Any real ' + LEN + '-letter word. Only you can see it until the game ends.</div></div>';
  renderKeys(true);
}

function renderOver() {
  const m = me(), a = $('actions'), dis = busy ? ' disabled' : '';
  let h = '<div class="card"><h2>Final</h2>' + S.players.map(function (p, i) {
    return '<div class="seat"><span>' + (S.winner === i ? '🏆 ' : '') + av(p) + esc(p.name) + '<br><span class="small">word: <b>' + esc(p.secret || '?') + '</b> · ' + (p.guesses || []).length + ' guesses</span></span><span class="big">' + num(p.score) + '</span></div>';
  }).join('') + '</div>';
  const w = S.players[S.winner];
  if (w) h += '<div class="card"><h2>' + esc(w.name) + '\'s guesses</h2>' + (w.guesses || []).map(function (g) { return tiles(g.w, g.f.split('')); }).join('') + '</div>';
  $('body').innerHTML = h;
  a.innerHTML = m >= 0 ? '<button class="primary" id="bRe"' + dis + '>Rematch (same players)</button><button id="bNew"' + dis + '>New game</button>' : '';
  if ($('bRe')) $('bRe').onclick = rematch;
  if ($('bNew')) $('bNew').onclick = function () { setupSheet(); };
  renderKeys(false);
}

function renderLobby() {
  const L = $('lobby');
  if (!S) {
    L.innerHTML = '<div class="card"><h2>New game</h2><div class="small">Each of you picks a secret 5-letter word, then you take turns guessing each other\'s, with sabotage along the way. 2 players, each on their own phone.</div>' +
      '<div class="small" style="margin-top:8px">Playing as <b>' + esc(myName()) + '</b>. Tap your avatar at the top right to change your name.</div>' +
      '<button class="primary" id="bCreate" style="width:100%;margin-top:12px">Create game</button></div>';
    $('bCreate').onclick = function () { newGame(myName()); };
    return;
  }
  const m = me();
  let h = '<div class="card"><h2>Lobby</h2>' + S.players.map(function (p, i) {
    return '<div class="seat"><span>' + av(p) + esc(p.name) + (i === 0 ? ' <span class="small">(host)</span>' : '') + (i === m ? ' <span class="small">(you)</span>' : '') + '</span></div>';
  }).join('') + '</div>';
  if (m < 0 && S.players.length < MAX_SEATS) {
    h += '<div class="card"><h2>Join</h2><div class="small">Joining as <b>' + esc(myName()) + '</b>. Then you both pick a secret word.</div><button class="primary" id="bJoin" style="width:100%;margin-top:10px">Join game</button></div>';
  } else if (m >= 0) {
    h += '<div class="card small center">Waiting for the other player to join from their Cipher Strike tab…</div>';
  }
  L.innerHTML = h;
  if ($('bJoin')) $('bJoin').onclick = function () { join(myName()); };
}

function myName() { return lsGet('cipher-name') || 'Player'; }   // the app login name (shim.js keeps it current)

// ---------- sheets ----------
function openSheet(html) { $('sheetIn').innerHTML = html; $('sheet').classList.remove('hidden'); }
function closeSheet() { $('sheet').classList.add('hidden'); }
$('sheet').onclick = function (e) { if (e.target.id === 'sheet') closeSheet(); };

function setupSheet() {
  openSheet('<h3>Start a new game</h3><div class="small">This replaces the current game in this tab for both of you.</div>' +
    '<div class="row" style="margin-top:12px"><button id="nCancel" style="flex:1">Cancel</button><button class="primary" id="nGo" style="flex:2">Create game</button></div>');
  $('nCancel').onclick = closeSheet;
  $('nGo').onclick = function () { closeSheet(); newGame(myName()); };
}
function menuSheet() {
  openSheet('<h3>Cipher Strike</h3>' +
    (window.GamesApp && GamesApp.winnersLog ? '<button id="mLog" style="width:100%;margin-bottom:10px">🏆 Winners\' Log</button>' : '') +
    '<div class="card"><h2>How to play</h2><div class="small">Each of you picks a secret 5-letter word. Then you take turns guessing the other word (who goes first is random). ' +
    'After each guess the letters light up: <b>green</b> = right letter, right spot; <b>yellow</b> = in the word, wrong spot; <b>gray</b> = not in the word. ' +
    '<b>Attack</b> shows your guesses; <b>Defend</b> shows your word, their guesses at it, and the sabotage shop.<br><br>' +
    'You earn 1 ⚡ Sabotage Point every turn. On your turn, before you guess, you can spend them: ' +
    '<b>🌫️ Smoke Screen</b> (' + SMOKE_COST + '): one letter of their next guess shows purple instead of its color (stack up to ' + MAX_SMOKE + '). ' +
    '<b>🔓 Data Leak</b> (' + LEAK_COST + '): you\'re shown one letter of their word you haven\'t tried yet (or, once you\'ve tried them all, which spot one goes in), and their guess list is shown out of order on their next turn.<br><br>' +
    'Scoring: you start with ' + num(START) + ' and each guess costs ' + PER_TURN + '. Cracking the word wins the game and earns ' + num(STRIKE) + ', plus ' + num(UNDER_FIRE) + ' more if you crack it while sabotaged.</div></div>' +
    (S && S.log ? '<div class="card"><h2>Recent</h2>' + S.log.map(function (l) { return '<div class="small">' + esc(l) + '</div>'; }).join('') + '</div>' : '') +
    '<button id="mNew" style="width:100%;margin-bottom:10px">Start a new game in this tab</button>' +
    (S ? '<button id="mClose2" style="width:100%;margin-bottom:10px">Close this game</button>' : '') +
    '<div class="card"><h2>Version history</h2>' + VERSIONS.map(function (v) { return '<div class="small" style="margin-bottom:6px"><b>' + v[0] + '</b> (' + v[1] + '): ' + esc(v[2]) + '</div>'; }).join('') + '</div>' +
    '<button id="mClose" style="width:100%">Close</button>');
  if ($('mLog')) $('mLog').onclick = function () { closeSheet(); GamesApp.winnersLog('cipher'); };
  $('mNew').onclick = function () { closeSheet(); setTimeout(setupSheet, 50); };
  if ($('mClose2')) $('mClose2').onclick = function () {
    openSheet('<h3>Close this game?</h3><div class="small">It ends for both of you and the tab is freed. This can\'t be undone.</div>' +
      '<div class="row" style="margin-top:12px"><button id="cNo" style="flex:1">Keep it</button><button class="primary" id="cYes" style="flex:1">Close game</button></div>');
    $('cNo').onclick = closeSheet;
    $('cYes').onclick = function () { closeSheet(); closeGame(); };
  };
  $('mClose').onclick = closeSheet;
}
$('menuBtn').onclick = menuSheet;

function toast(t) {
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 3200);
}
function buzzIfMyTurn() {
  const key = S && (S.gid + ':' + S.turn + ':' + S.status);
  if (myTurn() && key !== lastTurnKey && lastTurnKey && navigator.vibrate) navigator.vibrate(120);
  lastTurnKey = key || '';
}

// ---------- start ----------
render();
window.addEventListener('gamesprofiles', function () { if (S && window.GamesApp) GamesApp.fixNames(S.players); render(); });
store.get(function (st, err) {
  if (st !== undefined) apply(st);
  else toast(/Unknown game/.test(String(err && err.message || err)) ? 'Cipher Strike needs Games API 1.6. Player 1 has to update the Games API first.' : 'Could not load the game.');
});
loadWords();
setInterval(poll, 4000);
document.addEventListener('visibilitychange', poll);
</script>
